<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Studio Pro</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f141c; color: #e6edf3; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 18px; border-radius: 12px; width: 100%; max-width: 440px; box-sizing: border-box; }
    h2 { font-size: 1.25rem; margin: 0 0 14px 0; text-align: center; color: #58a6ff; }
    label { display: block; font-size: 0.85rem; margin-top: 10px; color: #8b949e; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; font-size: 0.95rem; }
    button { background: #238636; font-weight: bold; border: none; cursor: pointer; margin-top: 16px; }
    button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
    canvas { width: 100%; max-width: 440px; border-radius: 12px; margin-top: 16px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    video { width: 100%; max-width: 440px; border-radius: 12px; margin-top: 16px; display: none; }
    .dl-btn { display: none; text-align: center; background: #1f6feb; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 12px; width: 100%; max-width: 440px; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 Motion Studio Pro</h2>
    
    <label>Upload Image / Flyer / Document</label>
    <input type="file" id="mainImgInput" accept="image/*">

    <label>Motion & Animation Style</label>
    <select id="motionStyle">
      <option value="corporate">1. Corporate Flyer / Staggered Line Reveal (New)</option>
      <option value="vox">2. Vox Editorial (Archival Zoom + Yellow Highlight)</option>
      <option value="popup">3. 3D Origami Pop-Up (Depth Bounce & Shadows)</option>
      <option value="unfold">4. Vintage Creased Unfold (Multi-Fold Reveal)</option>
      <option value="stopmotion">5. True Stop-Motion Clay (10 FPS Stepped Jitter)</option>
    </select>

    <button id="renderBtn">Render Motion Video</button>
  </div>

  <canvas id="stage" width="720" height="1280"></canvas>
  <video id="player" controls autoplay loop playsinline></video>
  <a id="downloadBtn" class="dl-btn" download="motion_output.webm">⬇️ Download Video</a>

  <script>
    const mainImgInput = document.getElementById('mainImgInput');
    const motionStyle = document.getElementById('motionStyle');
    const renderBtn = document.getElementById('renderBtn');
    const stage = document.getElementById('stage');
    const ctx = stage.getContext('2d');
    const player = document.getElementById('player');
    const downloadBtn = document.getElementById('downloadBtn');

    let baseImg = null;

    mainImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          drawStaticPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawStaticPreview() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, stage.width, stage.height);
      const aspect = baseImg.width / baseImg.height;
      let drawW = stage.width * 0.9;
      let drawH = drawW / aspect;
      ctx.drawImage(baseImg, (stage.width - drawW)/2, (stage.height - drawH)/2, drawW, drawH);
    }

    function applyFilmGrain(intensity = 0.08) {
      const w = stage.width;
      const h = stage.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (Math.random() < 0.15) {
          const noise = (Math.random() - 0.5) * 255 * intensity;
          data[i] = Math.min(255, Math.max(0, data[i] + noise));
          data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
          data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    renderBtn.addEventListener('click', async () => {
      if (!baseImg) {
        alert("Pehle image select karein!");
        return;
      }

      renderBtn.disabled = true;
      renderBtn.innerText = "Rendering Motion...";

      const stream = stage.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.style.display = "block";
        downloadBtn.href = url;
        downloadBtn.style.display = "block";
        renderBtn.disabled = false;
        renderBtn.innerText = "Render Motion Video";
      };

      recorder.start();

      const style = motionStyle.value;
      if (style === 'corporate') {
        await renderCorporateFlyer();
      } else if (style === 'vox') {
        await renderVoxStyle();
      } else if (style === 'popup') {
        await renderOrigamiPopUp();
      } else if (style === 'unfold') {
        await renderPaperUnfold();
      } else {
        await renderTrueStopMotion();
      }

      recorder.stop();
    });

    // 1. Corporate Staggered Flyer Reveal (Sequential Section Wipe)
    function renderCorporateFlyer() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 100; // ~3.3 seconds at 30fps

        const targetW = stage.width * 0.92;
        const targetH = targetW * (baseImg.height / baseImg.width);
        const x = (stage.width - targetW) / 2;
        const y = (stage.height - targetH) / 2;

        const interval = setInterval(() => {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, stage.width, stage.height);

          // Top Header (Logo & Title) always remains pinned
          const headerH = targetH * 0.22;
          ctx.drawImage(baseImg, 0, 0, baseImg.width, baseImg.height * 0.22, x, y, targetW, headerH);

          // Body sections reveal sequentially in 5 stepped timing chunks
          const step = Math.min(Math.floor(frame / 16), 5); 
          const revealRatios = [0.22, 0.35, 0.50, 0.68, 0.85, 1.0];
          const currentRevealH = targetH * revealRatios[step];

          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, targetW, currentRevealH);
          ctx.clip();
          ctx.drawImage(baseImg, x, y, targetW, targetH);
          ctx.restore();

          // Subtle scanline indicator at current reveal edge
          if (step < 5) {
            ctx.fillStyle = "rgba(180, 0, 0, 0.15)";
            ctx.fillRect(x, y + currentRevealH - 4, targetW, 4);
          }

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 2. Vox Style
    function renderVoxStyle() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 80;

        const interval = setInterval(() => {
          ctx.fillStyle = "#121214";
          ctx.fillRect(0, 0, stage.width, stage.height);

          let progress = frame / totalFrames;
          let scale = 1.0 + (progress * 0.08);

          let baseW = stage.width * 0.85;
          let baseH = baseW * (baseImg.height / baseImg.width);
          let currentW = baseW * scale;
          let currentH = baseH * scale;
          let x = (stage.width - currentW) / 2;
          let y = (stage.height - currentH) / 2;

          ctx.drawImage(baseImg, x, y, currentW, currentH);

          if (frame > 15) {
            let markerProgress = Math.min((frame - 15) / 35, 1.0);
            ctx.save();
            ctx.fillStyle = "rgba(255, 235, 59, 0.45)";
            ctx.globalCompositeOperation = "multiply";
            let highlightY = y + currentH * 0.42;
            let highlightH = currentH * 0.16;
            ctx.fillRect(x, highlightY, currentW * markerProgress, highlightH);
            ctx.restore();
          }

          applyFilmGrain(0.06);

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 3. 3D Origami Pop-Up
    function renderOrigamiPopUp() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 75;

        const interval = setInterval(() => {
          ctx.fillStyle = "#e9e3d5";
          ctx.fillRect(0, 0, stage.width, stage.height);

          let progress = Math.min(frame / 45, 1.0);
          let ease = 1 - Math.pow(1 - progress, 3);
          let bounce = Math.sin(progress * Math.PI * 1.5) * 0.08;

          let targetW = stage.width * 0.82;
          let targetH = targetW * (baseImg.height / baseImg.width);
          let currentH = targetH * (ease + bounce);

          let x = (stage.width - targetW) / 2;
          let y = (stage.height - targetH) / 2 + (1 - ease) * 140;

          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.3)";
          ctx.shadowBlur = 35 * ease;
          ctx.shadowOffsetY = 25 * ease;
          ctx.drawImage(baseImg, 0, 0, baseImg.width, baseImg.height, x, y, targetW, currentH);
          ctx.restore();

          applyFilmGrain(0.04);

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 4. Vintage Creased Unfold
    function renderPaperUnfold() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 70;

        const interval = setInterval(() => {
          ctx.fillStyle = "#dcd3c1";
          ctx.fillRect(0, 0, stage.width, stage.height);

          let progress = Math.min(frame / 45, 1.0);
          let ease = 0.5 - Math.cos(progress * Math.PI) / 2;

          let targetW = stage.width * 0.88;
          let targetH = targetW * (baseImg.height / baseImg.width);
          let currentH = targetH * ease;

          let x = (stage.width - targetW) / 2;
          let y = (stage.height - currentH) / 2;

          ctx.drawImage(baseImg, 0, 0, baseImg.width, baseImg.height, x, y, targetW, currentH);

          if (progress < 1.0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${0.4 * (1 - progress)})`;
            ctx.fillRect(x, stage.height / 2 - 3, targetW, 6);
            ctx.fillRect(stage.width / 2 - 2, y, 4, currentH);
          }

          applyFilmGrain(0.08);

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 5. True Stop-Motion Clay
    function renderTrueStopMotion() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 60;

        const interval = setInterval(() => {
          if (frame % 3 === 0) {
            ctx.fillStyle = "#cfc9be";
            ctx.fillRect(0, 0, stage.width, stage.height);

            let progress = Math.min(frame / 35, 1.0);
            let targetW = stage.width * 0.82;
            let targetH = targetW * (baseImg.height / baseImg.width);

            let jitterAngle = (Math.random() - 0.5) * 0.05;
            let jitterX = (Math.random() - 0.5) * 8;
            let jitterY = (Math.random() - 0.5) * 8;

            let x = (stage.width - targetW) / 2 + jitterX;
            let y = (stage.height - targetH) / 2 + jitterY - (1 - progress) * 90;

            ctx.save();
            ctx.translate(x + targetW / 2, y + targetH / 2);
            ctx.rotate(jitterAngle);
            ctx.drawImage(baseImg, -targetW / 2, -targetH / 2, targetW, targetH);
            ctx.restore();

            applyFilmGrain(0.07);
          }

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }
  </script>
</body>
</html>
