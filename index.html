<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Pop-up & Stop Motion Studio</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #111418; color: #f0f3f6; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #1b2129; border: 1px solid #2d3748; padding: 18px; border-radius: 12px; width: 100%; max-width: 440px; box-sizing: border-box; }
    h2 { font-size: 1.25rem; margin-top: 0; text-align: center; color: #63b3ed; }
    label { display: block; font-size: 0.85rem; margin-top: 10px; color: #a0aec0; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #4a5568; background: #0d1117; color: white; box-sizing: border-box; font-size: 0.95rem; }
    button { background: #3182ce; font-weight: bold; border: none; cursor: pointer; margin-top: 16px; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    canvas { width: 100%; max-width: 440px; border-radius: 12px; margin-top: 16px; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    video { width: 100%; max-width: 440px; border-radius: 12px; margin-top: 16px; display: none; }
    .dl-btn { display: none; text-align: center; background: #38a169; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 12px; width: 100%; max-width: 440px; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📐 Origami & Motion Studio</h2>
    
    <label>Upload Main Image / Character</label>
    <input type="file" id="mainImgInput" accept="image/*">

    <label>Motion Style (Inspired by References)</label>
    <select id="motionStyle">
      <option value="popup">1. 3D Origami Pop-Up & Slide (Video 1 Style)</option>
      <option value="unfold">2. Vintage Paper Crease Unfold (Video 3 Style)</option>
      <option value="clay">3. Stop-Motion Layer Assembly (Video 2 Style)</option>
    </select>

    <button id="renderBtn">Render Motion Video</button>
  </div>

  <canvas id="stage" width="720" height="1280"></canvas>
  <video id="player" controls autoplay loop playsinline></video>
  <a id="downloadBtn" class="dl-btn" download="origami_motion.webm">⬇️ Download Video</a>

  <script>
    const mainImgInput = document.getElementById('mainImgInput');
    const motionStyle = document.getElementById('motionStyle');
    const renderBtn = document.getElementById('renderBtn');
    const stage = document.getElementById('stage');
    const ctx = stage.getContext('2d');
    const player = document.getElementById('player');
    const downloadBtn = document.getElementById('downloadBtn');

    let baseImg = null;

    mainImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          drawStaticPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawStaticPreview() {
      ctx.fillStyle = "#e2d9cc";
      ctx.fillRect(0, 0, stage.width, stage.height);
      const aspect = baseImg.width / baseImg.height;
      let drawW = stage.width * 0.85;
      let drawH = drawW / aspect;
      ctx.drawImage(baseImg, (stage.width - drawW)/2, (stage.height - drawH)/2, drawW, drawH);
    }

    renderBtn.addEventListener('click', async () => {
      if (!baseImg) {
        alert("Pehle image select karein!");
        return;
      }

      renderBtn.disabled = true;
      renderBtn.innerText = "Rendering Procedural Motion...";

      const stream = stage.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.style.display = "block";
        downloadBtn.href = url;
        downloadBtn.style.display = "block";
        renderBtn.disabled = false;
        renderBtn.innerText = "Render Motion Video";
      };

      recorder.start();

      const style = motionStyle.value;
      if (style === 'popup') {
        await renderOrigamiPopUp();
      } else if (style === 'unfold') {
        await renderPaperUnfold();
      } else {
        await renderStopMotionClay();
      }

      recorder.stop();
    });

    // 1. Origami Pop-up & Layer Rise (Reference Video 1)
    function renderOrigamiPopUp() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 75; // 2.5 seconds at 30fps

        const interval = setInterval(() => {
          ctx.fillStyle = "#f5efe6"; // Clean paper background
          ctx.fillRect(0, 0, stage.width, stage.height);

          let progress = Math.min(frame / 45, 1.0);
          // Ease-out elastic bounce
          let ease = 1 - Math.pow(1 - progress, 3);
          let bounce = Math.sin(progress * Math.PI * 1.5) * 0.1;

          let targetW = stage.width * 0.8;
          let targetH = targetW * (baseImg.height / baseImg.width);
          let currentH = targetH * (ease + bounce);

          let x = (stage.width - targetW) / 2;
          let y = (stage.height - targetH) / 2 + (1 - ease) * 150;

          // Realistic Paper Drop Shadow
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.25)";
          ctx.shadowBlur = 30 * ease;
          ctx.shadowOffsetY = 25 * ease;

          // Base fold reveal
          ctx.drawImage(baseImg, 0, 0, baseImg.width, baseImg.height, x, y, targetW, currentH);
          ctx.restore();

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 2. Vintage Paper Crease Unfold (Reference Video 3)
    function renderPaperUnfold() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 60; // 2 seconds

        const interval = setInterval(() => {
          ctx.fillStyle = "#dfd7c8"; // Old parchment shade
          ctx.fillRect(0, 0, stage.width, stage.height);

          let progress = Math.min(frame / 40, 1.0);
          let ease = 0.5 - Math.cos(progress * Math.PI) / 2;

          let targetW = stage.width * 0.9;
          let targetH = targetW * (baseImg.height / baseImg.width);
          let currentH = targetH * ease;

          let x = (stage.width - targetW) / 2;
          let y = (stage.height - currentH) / 2;

          // Draw unfolding top & bottom halves
          ctx.drawImage(baseImg, 0, 0, baseImg.width, baseImg.height, x, y, targetW, currentH);

          // Render paper fold lines & crease shadows
          if (progress < 1.0) {
            ctx.fillStyle = "rgba(0, 0, 0, " + (0.35 * (1 - progress)) + ")";
            ctx.fillRect(x, stage.height / 2 - 4, targetW, 8);
          }

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }

    // 3. Stop-Motion Clay / Layer Stagger (Reference Video 2)
    function renderStopMotionClay() {
      return new Promise((resolve) => {
        let frame = 0;
        const totalFrames = 60;

        const interval = setInterval(() => {
          // Low framerate feel (12 FPS stepped update)
          ctx.fillStyle = "#d8d3cd";
          ctx.fillRect(0, 0, stage.width, stage.height);

          let stepProgress = Math.min(Math.floor(frame / 4) / 10, 1.0);
          
          let targetW = stage.width * 0.8;
          let targetH = targetW * (baseImg.height / baseImg.width);

          // Discrete stop-motion jitter
          let jitterX = (Math.random() - 0.5) * 6;
          let jitterY = (Math.random() - 0.5) * 6;

          let x = (stage.width - targetW) / 2 + jitterX;
          let y = (stage.height - targetH) / 2 + jitterY - (1 - stepProgress) * 80;

          ctx.save();
          ctx.globalAlpha = Math.min(stepProgress * 1.4, 1.0);
          ctx.drawImage(baseImg, x, y, targetW, targetH);
          ctx.restore();

          frame++;
          if (frame > totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 33);
      });
    }
  </script>
</body>
</html>
